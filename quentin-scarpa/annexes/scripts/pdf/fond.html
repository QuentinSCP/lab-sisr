<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fond des pages</title>
<!-- Deux fonds A4 posés sous les pages du PDF, en alternance (A sur les pages impaires, B sur les paires). -->
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; }
  .page { position: relative; width: 210mm; height: 297mm; overflow: hidden; break-after: page; }
  .page:last-child { break-after: auto; }
  svg { position: absolute; inset: 0; width: 210mm; height: 297mm; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="sarcelle" cx="1" cy="0" r="0.75"><stop offset="0" stop-color="#3f8a83" stop-opacity=".20"/><stop offset="1" stop-color="#3f8a83" stop-opacity="0"/></radialGradient>
    <radialGradient id="peche" cx="0" cy="1" r="0.7"><stop offset="0" stop-color="#e2a574" stop-opacity=".18"/><stop offset="1" stop-color="#e2a574" stop-opacity="0"/></radialGradient>
    <radialGradient id="lavande" cx="1" cy=".55" r="0.45"><stop offset="0" stop-color="#a597cd" stop-opacity=".12"/><stop offset="1" stop-color="#a597cd" stop-opacity="0"/></radialGradient>
    <radialGradient id="sarcelle-bas" cx="1" cy="1" r="0.6"><stop offset="0" stop-color="#3f8a83" stop-opacity=".22"/><stop offset="1" stop-color="#3f8a83" stop-opacity="0"/></radialGradient>
    <pattern id="points" width="3.4" height="3.4" patternUnits="userSpaceOnUse"><circle cx="1.7" cy="1.7" r=".28" fill="#9fb3b0"/></pattern>
  </defs>
</svg>

<!-- Fond A : points en haut à gauche, cercles en bas à gauche, réseau en bas à droite -->
<div class="page">
  <svg viewBox="0 0 210 297" preserveAspectRatio="none">
    <rect width="210" height="297" fill="url(#sarcelle)"/>
    <rect width="210" height="297" fill="url(#peche)"/>
    <rect width="210" height="297" fill="url(#sarcelle-bas)"/>
    <rect x="6" y="6" width="56" height="36" fill="url(#points)" opacity=".7"/>
    <g fill="none" stroke="#d6dddb" stroke-width=".25">
      <circle cx="10" cy="290" r="16"/><circle cx="10" cy="290" r="28"/><circle cx="10" cy="290" r="40"/>
      <circle cx="10" cy="290" r="52"/><circle cx="10" cy="290" r="64"/><circle cx="10" cy="290" r="76"/>
    </g>
    <g stroke="#93a29f" stroke-width=".25" fill="none">
      <path d="M142 263 L162 244 L188 232 L214 244 M162 244 L188 256 L214 244 M142 263 L162 275 L188 256 L214 272"/>
    </g>
    <rect x="141" y="262" width="2.2" height="2.2" fill="#5e9d96"/>
    <rect x="161" y="243" width="2.2" height="2.2" fill="#8fb486"/>
    <rect x="187" y="231" width="2.2" height="2.2" fill="#5e9d96"/>
    <rect x="186.5" y="254.5" width="3.2" height="3.2" fill="#e2a574" opacity=".85"/>
    <rect x="161" y="274" width="2.2" height="2.2" fill="#a597cd"/>
    <rect x="207" y="243" width="2.2" height="2.2" fill="#8fb486"/>
    <rect x="207" y="271" width="2.2" height="2.2" fill="#a597cd"/>
  </svg>
</div>

<!-- Fond B : losanges en haut à droite, arcs en haut à gauche, points en bas à droite -->
<div class="page">
  <svg viewBox="0 0 210 297" preserveAspectRatio="none">
    <rect width="210" height="297" fill="url(#sarcelle)"/>
    <rect width="210" height="297" fill="url(#peche)"/>
    <rect width="210" height="297" fill="url(#lavande)"/>
    <g fill="none" stroke="#dde3e1" stroke-width=".25">
      <circle cx="0" cy="0" r="22"/><circle cx="0" cy="0" r="36"/><circle cx="0" cy="0" r="50"/><circle cx="0" cy="0" r="64"/>
    </g>
    <g stroke-width=".3">
      <path d="M172 14 L204 32 L172 50 L140 32 Z" fill="#8fb8b2" fill-opacity=".10" stroke="#8fb8b2"/>
      <path d="M172 24 L204 42 L172 60 L140 42 Z" fill="#e2b58c" fill-opacity=".08" stroke="#e2b58c"/>
      <path d="M172 34 L204 52 L172 70 L140 52 Z" fill="#b3a8d6" fill-opacity=".08" stroke="#b3a8d6"/>
    </g>
    <path d="M172 11 L172 34" stroke="#93a29f" stroke-width=".25" stroke-dasharray="1 1"/>
    <rect x="170.9" y="9" width="2.2" height="2.2" fill="#5e9d96"/>
    <rect x="185.4" y="55.4" width="2.4" height="2.4" fill="#e2a574"/>
    <rect x="146" y="251" width="58" height="40" fill="url(#points)" opacity=".7"/>
  </svg>
</div>
</body>
</html>
