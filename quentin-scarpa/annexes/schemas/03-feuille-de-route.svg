<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="Feuille de route en quatre phases" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="590" fill="#fcfbf8"/><g font-family="Century Gothic,Questrial,sans-serif"><line x1="38" y1="50" x2="38" y2="500" stroke="#c9c2b4" stroke-width="2"/><rect x="76" y="16" width="808" height="112" rx="10" fill="#fff" stroke="#d9d3c6" stroke-width="1.5"/><rect x="76" y="16" width="6" height="112" rx="3" fill="#3f8f8d"/><circle cx="38" cy="50" r="15" fill="#fff" stroke="#3f8f8d" stroke-width="2.5"/><text x="38" y="55" font-size="14" font-weight="700" fill="#2c6a68" text-anchor="middle">1</text><text x="100" y="46" font-size="16" font-weight="700" fill="#2b2b2b">Consolider</text><text x="868" y="46" font-size="12" fill="#2c6a68" text-anchor="end" font-weight="700">jusqu'à S6 · 13 nov. 2026</text><text x="100" y="70" font-size="12.5" fill="#444">Noms DNS · NTP · règles pfSense avec des alias · autorité de certification et HTTPS sur HAProxy</text><text x="100" y="88" font-size="12.5" fill="#444">sauvegardes planifiées · dépôt Git et premiers playbooks Ansible</text><rect x="100" y="104" width="9" height="9" fill="#3f8f8d" transform="rotate(45 104.5 108)"/><text x="120" y="113" font-size="12.5" fill="#6f6a61">Une VM restaurée et fonctionnelle (test T13)</text><rect x="76" y="144" width="808" height="112" rx="10" fill="#fff" stroke="#d9d3c6" stroke-width="1.5"/><rect x="76" y="144" width="6" height="112" rx="3" fill="#7fa87a"/><circle cx="38" cy="178" r="15" fill="#fff" stroke="#7fa87a" stroke-width="2.5"/><text x="38" y="183" font-size="14" font-weight="700" fill="#4f7049" text-anchor="middle">2</text><text x="100" y="174" font-size="16" font-weight="700" fill="#2b2b2b">Voir</text><text x="868" y="174" font-size="12" fill="#4f7049" text-anchor="end" font-weight="700">jusqu'à S7 · 8 janv. 2027</text><text x="100" y="198" font-size="12.5" fill="#444">Prometheus et Grafana · rsyslog central · GLPI</text><text x="100" y="216" font-size="12.5" fill="#444">alertes qui ouvrent un ticket GLPI · captures Wireshark</text><rect x="100" y="232" width="9" height="9" fill="#7fa87a" transform="rotate(45 104.5 236)"/><text x="120" y="241" font-size="12.5" fill="#6f6a61">Une alerte reçue lors d'une panne simulée</text><rect x="76" y="272" width="808" height="112" rx="10" fill="#fff" stroke="#d9d3c6" stroke-width="1.5"/><rect x="76" y="272" width="6" height="112" rx="3" fill="#dd9b66"/><circle cx="38" cy="306" r="15" fill="#fff" stroke="#dd9b66" stroke-width="2.5"/><text x="38" y="311" font-size="14" font-weight="700" fill="#a5622a" text-anchor="middle">3</text><text x="100" y="302" font-size="16" font-weight="700" fill="#2b2b2b">Protéger</text><text x="868" y="302" font-size="12" fill="#a5622a" text-anchor="end" font-weight="700">jusqu'à S9 · 5 févr. 2027</text><text x="100" y="326" font-size="12.5" fill="#444">OU, groupes et GPO · poste Windows et mobile · serveur de fichiers et Nextcloud</text><text x="100" y="344" font-size="12.5" fill="#444">Suricata · Wazuh · bastion · suppression des redirections SSH</text><rect x="100" y="360" width="9" height="9" fill="#dd9b66" transform="rotate(45 104.5 364)"/><text x="120" y="369" font-size="12.5" fill="#6f6a61">Un poste reçoit sa GPO ; l'administration ne passe que par le bastion</text><rect x="76" y="400" width="808" height="112" rx="10" fill="#fff" stroke="#d9d3c6" stroke-width="1.5"/><rect x="76" y="400" width="6" height="112" rx="3" fill="#9488bd"/><circle cx="38" cy="434" r="15" fill="#fff" stroke="#9488bd" stroke-width="2.5"/><text x="38" y="439" font-size="14" font-weight="700" fill="#6d6199" text-anchor="middle">4</text><text x="100" y="430" font-size="16" font-weight="700" fill="#2b2b2b">Réagir et fiabiliser</text><text x="868" y="430" font-size="12" fill="#6d6199" text-anchor="end" font-weight="700">jusqu'à S12 · 18 mars 2027</text><text x="100" y="454" font-size="12.5" fill="#444">Blocage automatique · tests de détection T15 à T17 · seconde instance HAProxy avec keepalived</text><text x="100" y="472" font-size="12.5" fill="#444">bonus : assistant IA local · en option : pfSense en CARP, second contrôleur</text><rect x="100" y="488" width="9" height="9" fill="#9488bd" transform="rotate(45 104.5 492)"/><text x="120" y="497" font-size="12.5" fill="#6f6a61">Tests de détection joués en moins de 10 minutes ; le site survit à l'arrêt d'une instance HAProxy</text><rect x="30" y="522" width="16" height="16" fill="#2c6a68" transform="rotate(45 38 530)"/><text x="76" y="535" font-size="14" font-weight="700" fill="#2b2b2b">S14 · 26 mars 2027 : dossier assemblé, tableau de l'annexe II.E définitif</text><text x="76" y="562" font-size="11" fill="#6f6a61">Repères : DAT de R1 en S4 (6 nov. 2026), DAT de R2 en S10 (19 févr. 2027). Entre S12 et S14 : reconstruction chronométrée avec Ansible.</text></g></svg>